[project]
name = "picquery-models"
version = "0.1.0"
description = "Model preprocessing, quantization and ONNX exports for PicQuery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "onnx>=1.21",
    "ftfy>=6.3.1",
    "huggingface-hub>=0.24.0",
    "onnxruntime>=1.24.4",
    "onnxscript>=0.6.2",
    "pillow>=12.2.0",
    "regex>=2026.4.4",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.1",
    "timm>=1.0.26",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "transformers>=5.7.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"
